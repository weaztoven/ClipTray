name: Build and release ClipTray

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and package portable app-image
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            [xml]$pom = Get-Content -Raw 'pom.xml'
            $pomVersion = $pom.SelectSingleNode("/*[local-name()='project']/*[local-name()='version']").InnerText
            if ($version -ne $pomVersion) {
              throw "Release tag version $version does not match pom.xml version $pomVersion."
            }
            .\package-exe.ps1 -Version $version
          } else {
            .\package-exe.ps1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipTray-${{ github.ref_name }}-Windows
          path: |
            target/portable/ClipTray-*-portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/portable/ClipTray-*-portable.zip
