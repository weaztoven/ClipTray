defaultFont = 13

@background = #202020
@surface = #252525
@surfaceElevated = #2c2c2c
@surfaceHover = #404040
@border = #333333
@muted = #a0a0a0
@text = #ffffff

Component.arc = 14
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.focusColor = #555555
Component.borderColor = @border
Component.background = @background
Component.foreground = @text

Panel.background = @background
Label.foreground = @text

TextField.background = @surface
TextField.foreground = @text
TextField.caretForeground = @text
TextField.placeholderForeground = @muted
TextField.selectionBackground = #454545
TextField.selectionForeground = @text
TextField.borderColor = @border
TextField.focusedBorderColor = #484848

List.background = @background
List.foreground = @text
List.selectionBackground = @surfaceElevated
List.selectionForeground = @text
ScrollPane.background = @background
ScrollPane.border = 0,0,0,0,@background

Button.arc = 14
Button.background = #323232
Button.foreground = @text
Button.borderColor = @border
Button.hoverBackground = @surfaceHover
Button.hoverBorderColor = #444444
Button.pressedBackground = #292929
Button.focusedBorderColor = #484848
Button.focusWidth = 0

PopupMenu.background = @background
PopupMenu.foreground = @text
PopupMenu.borderColor = @border
PopupMenu.borderInsets = 6,6,6,6
MenuItem.background = @background
MenuItem.foreground = @text
MenuItem.selectionBackground = @surfaceElevated
MenuItem.selectionForeground = @text
MenuItem.disabledForeground = @muted
MenuItem.margin = 4,10,4,10
MenuItem.acceleratorForeground = @muted
MenuItem.acceleratorSelectionForeground = @text
